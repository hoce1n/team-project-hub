services:
  postgres:
    image: postgres:16-alpine
    container_name: tp-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp_hub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tp_hub}
    ports:
      - "5432:5432"
    volumes:
      - tp_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp_hub} -d ${POSTGRES_DB:-tp_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tp_hub}:${POSTGRES_PASSWORD:-tp_hub_dev}@postgres:5432/${POSTGRES_DB:-tp_hub}?schema=public
    command: pnpm exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    container_name: tp-hub-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tp_hub}:${POSTGRES_PASSWORD:-tp_hub_dev}@postgres:5432/${POSTGRES_DB:-tp_hub}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - tp_hub_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  tp_hub_pgdata:
  tp_hub_uploads:
